{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-body d-flex gap-2 align-items-end flex-wrap">
        <div><label class="form-label">Grain <span class="text-muted fw-normal fs-xs">(nested with <code>:</code>)</span></label>
            <input class="form-control font-monospace" id="grain" list="grain-keys" value="{{ grain }}" style="min-width:280px"><datalist id="grain-keys"></datalist></div>
        <button class="btn btn-primary" id="go"><i class="ti ti-chart-pie me-1"></i>Explore</button>
        <div class="d-flex gap-1 flex-wrap ms-2">
            {% for k in ['os', 'osfinger', 'saltversion', 'roles', 'environment', 'datacenter', 'kernelrelease', 'num_cpus', 'virtual', 'init'] %}
            <button class="btn btn-sm btn-soft-secondary" data-g="{{ k }}">{{ k }}</button>{% endfor %}
        </div>
        <button class="btn btn-sm btn-light ms-auto" id="refresh" title="Reload grains cache"><i class="ti ti-refresh"></i></button>
    </div>
</div>
<div class="row">
    <div class="col-xl-5">
        <div class="card"><div class="card-header"><h4 class="card-title" id="chart-title">Distribution</h4></div>
            <div class="card-body"><div class="chart-box"><canvas id="chart" role="img" aria-label="Minions per grain value"></canvas></div></div></div>
    </div>
    <div class="col-xl-7">
        <div class="card" id="dist-card"><div class="card-header"><h4 class="card-title">Values</h4></div>
            <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Value</th><th>Minions</th><th class="text-end">Count</th><th></th></tr></thead><tbody id="dist"></tbody></table></div></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.js') }}"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script>
(function () {
    let chart = null;
    async function explore(refresh) {
        const g = document.getElementById('grain').value.trim();
        history.replaceState(null, '', '?grain=' + encodeURIComponent(g));
        SW.loading(document.getElementById('dist-card'), true);
        try {
            if (refresh) await SW.api('/api/grains/keys?refresh=1');
            const d = await SW.api('/api/grains/distribution?grain=' + encodeURIComponent(g));
            document.getElementById('chart-title').textContent = 'Minions per ' + g;
            document.getElementById('dist').innerHTML = d.map(r => `<tr><td class="font-monospace fw-semibold">${SW.esc(r.value)}</td>
                <td>${r.minions.map(m => `<a class="badge badge-soft-info me-1" href="/minions/${encodeURIComponent(m)}">${SW.esc(m)}</a>`).join('')}</td>
                <td class="text-end fw-semibold">${r.count}</td>
                <td class="table-actions">${r.value !== '(not set)' ? `<a class="btn btn-sm btn-light" title="Target these minions" href="/run?tgt_type=grain&tgt=${encodeURIComponent(g + ':' + r.value)}"><i class="ti ti-target-arrow"></i></a>` : ''}</td></tr>`).join('')
                || '<tr><td colspan="4" class="text-muted">No data</td></tr>';
            if (chart) chart.destroy();
            const pairs = d.slice(0, 8).map(r => [r.value, r.count]);
            if (d.length > 8) pairs.push(['Other', d.slice(8).reduce((a, r) => a + r.count, 0)]);
            chart = SW.hbar(document.getElementById('chart'), pairs, { label: 'Minions' });
        } finally { SW.loading(document.getElementById('dist-card'), false); }
    }
    SW.api('/api/grains/keys', { quiet: true }).then(k => { document.getElementById('grain-keys').innerHTML = k.map(x => `<option value="${SW.esc(x)}">`).join(''); });
    document.getElementById('go').addEventListener('click', () => explore(false));
    document.getElementById('refresh').addEventListener('click', () => explore(true));
    document.getElementById('grain').addEventListener('keydown', e => { if (e.key === 'Enter') explore(false); });
    document.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { document.getElementById('grain').value = b.dataset.g; explore(false); }));
    explore(false);
})();
</script>
{% endblock %}
