# Job cache + event history in PostgreSQL (read by Salt Conductor)
master_job_cache: pgjsonb
event_return: pgjsonb
event_return_blacklist:
  - 'salt/auth'
  - 'salt/event/new_client'
  - '_salt_error'
keep_jobs_seconds: 2592000

returner.pgjsonb.host: postgres
returner.pgjsonb.user: salt
returner.pgjsonb.pass: salt
returner.pgjsonb.db: salt
returner.pgjsonb.port: 5432
