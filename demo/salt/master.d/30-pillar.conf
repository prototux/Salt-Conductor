pillar_source_merging_strategy: smart
pillar_merge_lists: False
ext_pillar_first: False

ext_pillar:
  # 1. pillar SLS files from git
  - git:
    - main file:///srv/git/pillar.git
  # 2. key/values stored in PostgreSQL, managed from Salt Conductor
  - conductor_db:
      host: postgres
      port: 5432
      dbname: salt
      user: salt
      password: salt
  # 3. secrets stored in OpenBao (Vault API compatible, via saltext-vault)
  - vault:
      conf: path=secret/salt/common
      nesting_key: secrets
  - vault:
      conf: path=secret/salt/minions/{minion}
      nesting_key: secrets

vault:
  auth:
    method: token
    token: root
  server:
    url: http://openbao:8200
  cache:
    backend: session
