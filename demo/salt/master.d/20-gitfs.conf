# States live in git (served through gitfs), each branch is a saltenv.
fileserver_backend:
  - gitfs
  - roots

gitfs_provider: gitpython
gitfs_base: main
gitfs_update_interval: 60
gitfs_remotes:
  - file:///srv/git/states.git

file_roots:
  base:
    - /srv/salt

# Pillars live in git too (git_pillar), "main" is the base pillarenv.
git_pillar_provider: gitpython
git_pillar_base: main
git_pillar_branch: main
git_pillar_update_interval: 60
