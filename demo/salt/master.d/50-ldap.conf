# LDAP eauth (requires python-ldap in the onedir, see Dockerfile).
#
# Login: the user is searched with auth.ldap.filter using the read-only bind account,
# then a bind with the user's own DN + password checks the password. The filter
# only matches members of cn=salt-users (memberOf overlay), so anybody else is
# refused even with a valid password.
#
# Authorization: group ACLs ("salt-admins%", "salt-operators%") in 10-api.conf.
# Group lookup uses the generic group_basedn/group_filter code path (freeipa: True),
# which works for any directory storing members as DNs (groupOfUniqueNames/groupOfNames).
auth.ldap.uri: ldap://openldap:389
auth.ldap.tls: False
auth.ldap.starttls: False
auth.ldap.no_verify: True
auth.ldap.basedn: ou=people,dc=example,dc=org
auth.ldap.scope: 2
auth.ldap.binddn: cn=readonly,dc=example,dc=org
auth.ldap.bindpw: readonly
auth.ldap.filter: '(&(objectClass=inetOrgPerson)(uid={{ username }})(memberOf=cn=salt-users,ou=groups,dc=example,dc=org))'
auth.ldap.freeipa: True
auth.ldap.group_basedn: ou=groups,dc=example,dc=org
auth.ldap.group_filter: '(&(objectClass=groupOfUniqueNames)(uniqueMember=uid={{ username }},ou=people,dc=example,dc=org))'
auth.ldap.accountattributename: uniqueMember
auth.ldap.groupattribute: memberOf
auth.ldap.groupclass: groupOfUniqueNames
